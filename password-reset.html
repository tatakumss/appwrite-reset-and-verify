<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PediaHerb - Password Reset</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@15.0.0"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2E7D32, #1B5E20);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
        }

        h1 {
            color: #2E7D32;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input[type="email"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .btn {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            margin-bottom: 15px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .success {
            background: #e8f5e8;
            color: #2e7d32;
            border: 1px solid #4caf50;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #f44336;
        }

        .info {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #2196f3;
        }

        .hidden {
            display: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-link {
            color: #4CAF50;
            text-decoration: none;
            font-weight: 500;
            margin-top: 20px;
            display: inline-block;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .reset-icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: #4CAF50;
        }

        .password-requirements {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 14px;
            color: #666;
        }

        .password-requirements ul {
            margin: 8px 0 0 20px;
        }

        .password-requirements li {
            margin-bottom: 4px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🌿</div>
        <h1>PediaHerb</h1>
        <p class="subtitle">Password Reset</p>

        <div id="message" class="message hidden"></div>

        <!-- Password Reset Form -->
        <div id="complete-reset" class="reset-step">
            <div class="reset-icon">🔑</div>
            
            <h2 style="margin-bottom: 20px; color: #333;">Create New Password</h2>
            
            <p style="margin-bottom: 20px; color: #666;">
                Please enter your new password below.
            </p>

            <div class="password-requirements">
                <strong>Password Requirements:</strong>
                <ul>
                    <li>At least 8 characters long</li>
                    <li>Must contain letters and numbers</li>
                    <li>Both passwords must match</li>
                </ul>
            </div>

            <form id="complete-reset-form" onsubmit="completePasswordReset(event)">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" required placeholder="Enter new password" minlength="8">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" required placeholder="Confirm new password" minlength="8">
                </div>
                <button type="submit" class="btn">
                    <span id="complete-loading" class="loading hidden"></span>
                    <span id="complete-text">Update Password</span>
                </button>
            </form>
        </div>

        <a href="#" class="back-link" onclick="openApp()">← Back to PediaHerb App</a>
    </div>

    <script>
        // ⚙️ CONFIGURATION - Update these values for your deployment
        const APPWRITE_ENDPOINT = 'https://nyc.cloud.appwrite.io/v1';
        const APPWRITE_PROJECT_ID = '68d4f15b002baad3b7f6';
        const RESET_REDIRECT_URL = window.location.origin + '/password-reset.html';
        
        // Appwrite configuration
        const client = new Appwrite.Client()
            .setEndpoint(APPWRITE_ENDPOINT)
            .setProject(APPWRITE_PROJECT_ID);

        const account = new Appwrite.Account(client);

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        const secret = urlParams.get('secret');

        // Initialize page
        window.onload = function() {
            if (userId && secret) {
                // Show success message and password form
                showMessage('✅ Reset link verified! Please create your new password below.', 'success');
                document.getElementById('complete-reset').classList.remove('hidden');
            } else {
                // No reset parameters, show error message
                document.getElementById('complete-reset').style.display = 'none';
                showMessage('❌ Invalid reset link. Please use the reset link from your email or request a new one from the mobile app.', 'error');
            }
        };

        function showMessage(text, type = 'info') {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.classList.remove('hidden');
        }

        function hideMessage() {
            document.getElementById('message').classList.add('hidden');
        }



        async function completePasswordReset(event) {
            event.preventDefault();
            
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            // Validation
            if (newPassword !== confirmPassword) {
                showMessage('❌ Passwords do not match!', 'error');
                return;
            }

            if (newPassword.length < 8) {
                showMessage('❌ Password must be at least 8 characters long!', 'error');
                return;
            }

            if (!/(?=.*[a-zA-Z])(?=.*\d)/.test(newPassword)) {
                showMessage('❌ Password must contain both letters and numbers!', 'error');
                return;
            }

            const btn = event.target.querySelector('button');
            const loading = document.getElementById('complete-loading');
            const text = document.getElementById('complete-text');
            
            btn.disabled = true;
            loading.classList.remove('hidden');
            text.textContent = 'Updating...';

            try {
                await account.updateRecovery(userId, secret, newPassword, newPassword);
                
                showMessage('🎉 Password updated successfully! You can now login with your new password.', 'success');
                document.getElementById('complete-reset-form').reset();
                text.textContent = 'Password Updated!';
                
                // Redirect to app after 3 seconds
                setTimeout(() => {
                    showMessage('Redirecting to PediaHerb app...', 'info');
                    setTimeout(openApp, 1000);
                }, 3000);
                
            } catch (error) {
                console.error('Password update error:', error);
                let errorMessage = 'Password update failed. ';
                
                if (error.code === 401 || error.message.includes('expired') || error.message.includes('Invalid credentials')) {
                    errorMessage += 'The reset link has expired. Please request a new password reset.';
                } else if (error.code === 400 || error.message.includes('invalid') || error.message.includes('Invalid')) {
                    errorMessage += 'The reset link is invalid. Please request a new password reset.';
                } else if (error.message.includes('password') && error.message.includes('weak')) {
                    errorMessage += 'Password is too weak. Please choose a stronger password.';
                } else if (error.message.includes('network') || error.message.includes('Network')) {
                    errorMessage += 'Network error. Please check your internet connection.';
                } else {
                    errorMessage += error.message || 'Please try again later.';
                }
                
                showMessage(`❌ ${errorMessage}`, 'error');
                text.textContent = 'Update Password';
                btn.disabled = false;
                loading.classList.add('hidden');
            }
        }

        function openApp() {
            // Try to open the mobile app first, fallback to a message
            const appScheme = 'pediaherb://login';
            const fallbackMessage = 'Please open the PediaHerb app on your device to login with your new password.';
            
            // Create a hidden link to try opening the app
            const link = document.createElement('a');
            link.href = appScheme;
            link.style.display = 'none';
            document.body.appendChild(link);
            
            try {
                link.click();
                // Show fallback message after a short delay
                setTimeout(() => {
                    showMessage(fallbackMessage, 'info');
                }, 1000);
            } catch (error) {
                showMessage(fallbackMessage, 'info');
            }
            
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
