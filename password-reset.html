<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@15.0.0"></script>
    <style>
        :root {
            /* Theme Colors - Easy to customize */
            --primary-color: #4CAF50;
            --primary-dark: #2E7D32;
            --secondary-color: #1B5E20;
            --success-color: #4CAF50;
            --error-color: #f44336;
            --warning-color: #ff9800;
            --info-color: #2196f3;
            
            /* Background Colors */
            --bg-gradient: linear-gradient(135deg, var(--primary-dark), var(--secondary-color));
            --card-bg: #ffffff;
            --input-bg: #ffffff;
            
            /* Text Colors */
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-light: #999999;
            
            /* Spacing */
            --border-radius: 12px;
            --card-padding: 2rem;
            --input-padding: 0.75rem 1rem;
            
            /* Shadows */
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --button-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            padding: var(--card-padding);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: var(--primary-color);
            border-radius: 50%;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }

        h1 {
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.9rem;
        }

        input[type="password"] {
            width: 100%;
            padding: var(--input-padding);
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s ease;
            background: var(--input-bg);
        }

        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.875rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: var(--button-shadow);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .success { background: #e8f5e8; color: #2e7d32; border: 1px solid var(--success-color); }
        .error { background: #ffebee; color: #c62828; border: 1px solid var(--error-color); }
        .info { background: #e3f2fd; color: #1565c0; border: 1px solid var(--info-color); }

        .hidden { display: none; }

        .loading {
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            margin-top: 1.5rem;
            display: inline-block;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .requirements {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            text-align: left;
            font-size: 0.85rem;
        }

        .requirements ul {
            margin: 0.5rem 0 0 1rem;
            list-style: none;
        }

        .requirements li {
            margin-bottom: 0.25rem;
            transition: color 0.2s ease;
        }

        .requirements li::before {
            content: '•';
            margin-right: 0.5rem;
        }

        .requirements li.valid {
            color: var(--success-color);
        }

        .requirements li.invalid {
            color: var(--error-color);
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
                margin: 0.5rem;
            }
            
            h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo" id="app-logo">🔑</div>
        <h1 id="app-title">Password Reset</h1>
        <p class="subtitle" id="app-subtitle">Create your new password</p>

        <div id="message" class="message hidden"></div>

        <div id="reset-form" class="hidden">
            <div class="requirements">
                <strong>Password Requirements:</strong>
                <ul>
                    <li id="req-length">At least 8 characters</li>
                    <li id="req-letters">Letters and numbers</li>
                    <li id="req-match">Passwords must match</li>
                </ul>
            </div>

            <form id="password-form" onsubmit="handlePasswordReset(event)">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" required placeholder="Enter new password" minlength="8">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" required placeholder="Confirm new password" minlength="8">
                </div>
                <button type="submit" class="btn">
                    <span id="loading" class="loading hidden"></span>
                    <span id="button-text">Update Password</span>
                </button>
            </form>
        </div>

        <a href="#" class="back-link" id="back-link" onclick="goBack()">← Back to App</a>
    </div>

    <script src="password-reset.js"></script>
</body>
</html>
