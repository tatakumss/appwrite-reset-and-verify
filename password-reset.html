<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PediaHerb - Create New Password</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@15.0.0"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2E7D32, #1B5E20);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
        }

        h1 {
            color: #2E7D32;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        input[type="email"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        input[type="password"]:invalid {
            border-color: #f44336;
        }

        .btn {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            margin-bottom: 15px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .success {
            background: #e8f5e8;
            color: #2e7d32;
            border: 1px solid #4caf50;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #f44336;
        }

        .info {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #2196f3;
        }

        .hidden {
            display: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-link {
            color: #4CAF50;
            text-decoration: none;
            font-weight: 500;
            margin-top: 20px;
            display: inline-block;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .reset-icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: #4CAF50;
        }

        .password-requirements {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 14px;
            color: #666;
        }

        .password-requirements ul {
            margin: 8px 0 0 20px;
        }

        .password-requirements li {
            margin-bottom: 4px;
            transition: color 0.3s ease;
        }

        .password-requirements li.valid {
            color: #4CAF50;
        }

        .password-requirements li.invalid {
            color: #f44336;
        }

        .password-strength {
            margin-bottom: 20px;
            text-align: left;
        }

        .strength-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
            border-radius: 4px;
        }

        .strength-weak { background-color: #f44336; }
        .strength-medium { background-color: #ff9800; }
        .strength-strong { background-color: #4CAF50; }

    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🌿</div>
        <h1>PediaHerb</h1>
        <p class="subtitle">Password Reset</p>

        <div id="message" class="message hidden"></div>

        <!-- Password Reset Form -->
        <div id="complete-reset" class="reset-step hidden">
            <div class="reset-icon">🔑</div>
            
            <h2 style="margin-bottom: 20px; color: #333;">Create New Password</h2>
            
            <p style="margin-bottom: 20px; color: #666;">
                Please enter your new password below.
            </p>

            <div class="password-requirements">
                <strong>Password Requirements:</strong>
                <ul>
                    <li id="req-length">✓ At least 8 characters long</li>
                    <li id="req-letters">✓ Must contain letters and numbers</li>
                    <li id="req-match">✓ Both passwords must match</li>
                    <li id="req-secure">✓ Avoid common passwords</li>
                </ul>
            </div>

            <div id="password-strength" class="password-strength hidden">
                <div class="strength-bar">
                    <div id="strength-fill" class="strength-fill"></div>
                </div>
                <span id="strength-text">Password strength: Weak</span>
            </div>

            <form id="complete-reset-form" onsubmit="completePasswordReset(event)">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" required placeholder="Enter new password" minlength="8">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" required placeholder="Confirm new password" minlength="8">
                </div>
                <button type="submit" class="btn">
                    <span id="complete-loading" class="loading hidden"></span>
                    <span id="complete-text">Update Password</span>
                </button>
            </form>
        </div>

        <a href="#" class="back-link" onclick="openApp()">← Back to PediaHerb App</a>
    </div>

    <script>
        // ⚙️ CONFIGURATION - Update these values for your deployment
        const APPWRITE_ENDPOINT = 'https://nyc.cloud.appwrite.io/v1';
        const APPWRITE_PROJECT_ID = '68d4f15b002baad3b7f6';
        const RESET_REDIRECT_URL = window.location.origin + '/password-reset.html';
        
        // Appwrite configuration
        const client = new Appwrite.Client()
            .setEndpoint(APPWRITE_ENDPOINT)
            .setProject(APPWRITE_PROJECT_ID);

        const account = new Appwrite.Account(client);

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        const secret = urlParams.get('secret');

        // Initialize page
        window.onload = function() {
            console.log('Page loaded. UserId:', userId, 'Secret:', secret ? 'present' : 'missing');
            
            if (userId && secret) {
                // Show success message and password form
                showMessage('✅ Reset link verified! Please create your new password below.', 'success');
                document.getElementById('complete-reset').classList.remove('hidden');
                
                // Focus on the first password field and add event listeners
                setTimeout(() => {
                    const newPasswordField = document.getElementById('new-password');
                    const confirmPasswordField = document.getElementById('confirm-password');
                    
                    newPasswordField.focus();
                    
                    // Add real-time validation
                    newPasswordField.addEventListener('input', validatePasswordStrength);
                    confirmPasswordField.addEventListener('input', validatePasswordMatch);
                }, 100);
            } else {
                // No reset parameters, show error message
                showMessage('❌ Invalid reset link. Please use the reset link from your email or request a new one from the mobile app.', 'error');
                console.error('Missing reset parameters:', { userId, secret });
            }
        };

        function showMessage(text, type = 'info') {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.classList.remove('hidden');
        }

        function hideMessage() {
            document.getElementById('message').classList.add('hidden');
        }

        function validatePasswordStrength() {
            const password = document.getElementById('new-password').value;
            const strengthBar = document.getElementById('password-strength');
            const strengthFill = document.getElementById('strength-fill');
            const strengthText = document.getElementById('strength-text');
            
            // Show strength bar when user starts typing
            if (password.length > 0) {
                strengthBar.classList.remove('hidden');
            } else {
                strengthBar.classList.add('hidden');
                return;
            }
            
            let score = 0;
            let strength = 'Weak';
            let color = 'strength-weak';
            
            // Length check
            const lengthReq = document.getElementById('req-length');
            if (password.length >= 8) {
                score += 25;
                lengthReq.classList.add('valid');
                lengthReq.classList.remove('invalid');
            } else {
                lengthReq.classList.add('invalid');
                lengthReq.classList.remove('valid');
            }
            
            // Letters and numbers check
            const lettersReq = document.getElementById('req-letters');
            if (/(?=.*[a-zA-Z])(?=.*\d)/.test(password)) {
                score += 25;
                lettersReq.classList.add('valid');
                lettersReq.classList.remove('invalid');
            } else {
                lettersReq.classList.add('invalid');
                lettersReq.classList.remove('valid');
            }
            
            // Common passwords check
            const secureReq = document.getElementById('req-secure');
            if (!/^(12345678|password|qwerty|abc123|123456)/i.test(password) && !/^(.)\1+$/.test(password)) {
                score += 25;
                secureReq.classList.add('valid');
                secureReq.classList.remove('invalid');
            } else {
                secureReq.classList.add('invalid');
                secureReq.classList.remove('valid');
            }
            
            // Additional complexity
            if (/[A-Z]/.test(password)) score += 10; // Uppercase
            if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) score += 15; // Special chars
            
            // Determine strength
            if (score >= 75) {
                strength = 'Strong';
                color = 'strength-strong';
            } else if (score >= 50) {
                strength = 'Medium';
                color = 'strength-medium';
            }
            
            // Update UI
            strengthFill.style.width = score + '%';
            strengthFill.className = 'strength-fill ' + color;
            strengthText.textContent = 'Password strength: ' + strength;
            
            // Validate match if confirm password has value
            validatePasswordMatch();
        }

        function validatePasswordMatch() {
            const password = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const matchReq = document.getElementById('req-match');
            
            if (confirmPassword.length > 0) {
                if (password === confirmPassword) {
                    matchReq.classList.add('valid');
                    matchReq.classList.remove('invalid');
                } else {
                    matchReq.classList.add('invalid');
                    matchReq.classList.remove('valid');
                }
            } else {
                matchReq.classList.remove('valid', 'invalid');
            }
        }



        async function completePasswordReset(event) {
            event.preventDefault();
            
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            // Comprehensive validation
            if (!newPassword || !confirmPassword) {
                showMessage('❌ Please fill in both password fields!', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage('❌ Passwords do not match!', 'error');
                document.getElementById('confirm-password').focus();
                return;
            }

            if (newPassword.length < 8) {
                showMessage('❌ Password must be at least 8 characters long!', 'error');
                document.getElementById('new-password').focus();
                return;
            }

            if (!/(?=.*[a-zA-Z])(?=.*\d)/.test(newPassword)) {
                showMessage('❌ Password must contain both letters and numbers!', 'error');
                document.getElementById('new-password').focus();
                return;
            }

            // Additional validation for common weak passwords
            if (/^(.)\1+$/.test(newPassword)) {
                showMessage('❌ Password cannot be all the same character!', 'error');
                document.getElementById('new-password').focus();
                return;
            }

            if (/^(12345678|password|qwerty|abc123|123456)/i.test(newPassword)) {
                showMessage('❌ Please choose a more secure password!', 'error');
                document.getElementById('new-password').focus();
                return;
            }

            const btn = event.target.querySelector('button');
            const loading = document.getElementById('complete-loading');
            const text = document.getElementById('complete-text');
            
            btn.disabled = true;
            loading.classList.remove('hidden');
            text.textContent = 'Updating...';

            try {
                await account.updateRecovery(userId, secret, newPassword, confirmPassword);
                
                showMessage('🎉 Password updated successfully! You can now login with your new password.', 'success');
                document.getElementById('complete-reset-form').reset();
                text.textContent = 'Password Updated!';
                
                // Redirect to app after 3 seconds
                setTimeout(() => {
                    showMessage('Redirecting to PediaHerb app...', 'info');
                    setTimeout(openApp, 1000);
                }, 3000);
                
            } catch (error) {
                console.error('Password update error:', error);
                let errorMessage = 'Password update failed. ';
                
                // Handle specific Appwrite error codes
                if (error.code === 401) {
                    errorMessage += 'The reset link has expired or is invalid. Please request a new password reset from the mobile app.';
                } else if (error.code === 400) {
                    if (error.message && error.message.includes('Password')) {
                        errorMessage += 'Password does not meet requirements. Please ensure it has at least 8 characters with letters and numbers.';
                    } else {
                        errorMessage += 'Invalid request. Please check your input and try again.';
                    }
                } else if (error.code === 429) {
                    errorMessage += 'Too many attempts. Please wait a few minutes before trying again.';
                } else if (error.code === 500 || error.code === 503) {
                    errorMessage += 'Server error. Please try again in a few moments.';
                } else if (error.message && error.message.includes('network')) {
                    errorMessage += 'Network error. Please check your internet connection and try again.';
                } else {
                    errorMessage += error.message || 'An unexpected error occurred. Please try again.';
                }
                
                showMessage(`❌ ${errorMessage}`, 'error');
                text.textContent = 'Update Password';
                btn.disabled = false;
                loading.classList.add('hidden');
            }
        }

        function openApp() {
            // Try to open the mobile app first, fallback to a message
            const appScheme = 'pediaherb://login';
            const fallbackMessage = 'Please open the PediaHerb app on your device to login with your new password.';
            
            // Create a hidden link to try opening the app
            const link = document.createElement('a');
            link.href = appScheme;
            link.style.display = 'none';
            document.body.appendChild(link);
            
            try {
                link.click();
                // Show fallback message after a short delay
                setTimeout(() => {
                    showMessage(fallbackMessage, 'info');
                }, 1000);
            } catch (error) {
                showMessage(fallbackMessage, 'info');
            }
            
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
